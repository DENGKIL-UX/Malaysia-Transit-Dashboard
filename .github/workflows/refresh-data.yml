name: Refresh Transit Data

on:
  # Daily at 06:15 MYT (22:15 UTC previous day)
  # 15 min after data.gov.my's typical batch publication window
  schedule:
    - cron: '15 22 * * *'
  # Monthly at 06:30 MYT on the 12th — headline audit publishes ~T-12
  # Refreshes the headline-recent.json static file with the latest audited data
  - cron: '30 22 12 * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-daily:
    name: Refresh Prasarana & KTMB OD Data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas pyarrow requests --quiet

      - name: Run parquet processor
        run: python scripts/process_parquet.py
        env:
          OUTPUT_DIR: public

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet public/prasarana-daily*.json public/ktmb-daily*.json public/*-stations.json public/*-routes.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data files changed:"
            git diff --stat public/
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/prasarana-daily*.json public/ktmb-daily*.json public/*-stations.json public/*-routes.json
          git commit -m "data: refresh OD parquet data $(date -u +%Y-%m-%d)"
          git push

  refresh-monthly:
    name: Refresh Headline Static File
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on the 12th of each month (or manual trigger)
    if: github.event.schedule == '30 22 12 * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run headline refresh script
        run: node scripts/refresh-headline.js
        env:
          HEADLINE_OUTPUT: public/headline-recent.json

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet public/headline-recent.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No headline changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat public/
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/headline-recent.json
          git commit -m "data: refresh headline data $(date -u +%Y-%m-%d)"
          git push