name: Refresh Transit Data

# NOTE: every `cron` entry must be nested under `schedule:`. A `-` at the
# same indentation as `schedule:`/`workflow_dispatch:` is invalid YAML and
# makes GitHub reject the whole workflow ("workflow file issue") — which is
# what silently broke all scheduled refreshes before 2026-08-01.

on:
  # Schedule tuned to observed DOSM publish windows (all times MYT = UTC+8):
  #   KTMB daily publishes ~03:45-08:30 · RapidRail/BRT OD publish ~17:30-22:00
  schedule:
    - cron: '15 16 * * *'    # 00:15 MYT — catch overnight publishes
    - cron: '15 22 * * *'    # 06:15 MYT — catch KTMB ~03:45 publish
    - cron: '15 04 * * *'    # 12:15 MYT — catch KTMB ~08:30 publish
    - cron: '45 10 * * *'    # 18:45 MYT — catch OD ~17:30 publish
    - cron: '35 15 * * *'    # 23:35 MYT — catch OD ~22:00 publish (next_update)
    # Monthly backstop at 14:45 MYT on the 12th — headline audit publishes
    # at 12:00 MYT on the 12th, so this must run AFTER that (was 06:30 MYT
    # on the 12th = 5.5h too early → would have missed every audit publish)
    - cron: '45 06 12 * *'   # 14:45 MYT on 12th
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force:
        description: 'Force commit even if no data changes detected'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

# Prevent overlapping runs racing each other on `git push`
concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-daily:
    name: Refresh All OD Data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'   # hashes requirements.txt at repo root (must exist)

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet

      - name: Download DOSM metadata first (for logging)
        run: |
          echo "=== Fetching live DOSM metadata ==="
          curl -sL --max-time 15 \
            "https://raw.githubusercontent.com/data-gov-my/datagovmy-meta/main/data-catalogue/ridership_od_rapidrail_daily.json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'RapidRail: data_as_of={d.get(\"data_as_of\",\"N/A\")}, last_updated={d.get(\"last_updated\",\"N/A\")}')" \
            || echo "  (RapidRail meta fetch failed — non-fatal)"
          curl -sL --max-time 15 \
            "https://raw.githubusercontent.com/data-gov-my/datagovmy-meta/main/data-catalogue/ridership_od_brt_daily.json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'BRT: data_as_of={d.get(\"data_as_of\",\"N/A\")}, last_updated={d.get(\"last_updated\",\"N/A\")}')" \
            || echo "  (BRT meta fetch failed — non-fatal)"
          curl -sL --max-time 15 \
            "https://raw.githubusercontent.com/data-gov-my/datagovmy-meta/main/data-catalogue/ridership_ktmb_daily.json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'KTMB Daily: data_as_of={d.get(\"data_as_of\",\"N/A\")}')" \
            || echo "  (KTMB meta fetch failed — non-fatal)"
          true

      - name: Run Explorer parquet processor (KTMB dashboard + routes only)
        run: python scripts/process_parquet.py
        env:
          OUTPUT_DIR: public
        continue-on-error: true
        # Note: prasarana-stations.json from this step is overwritten by DOSM OD processor below

      - name: Run DOSM OD Daily processor (annual parquets + metadata)
        run: python mini-services/dosm-sync/process_od_parquet.py --download
        env:
          OUTPUT_DIR: public
          AUTO_DOWNLOAD: 'true'

      - name: Refresh headline static file (daily — audit can publish any day)
        run: node scripts/refresh-headline.js
        env:
          HEADLINE_OUTPUT: public/headline-recent.json
        continue-on-error: true   # non-fatal: monthly job is the backstop

      - name: Log processed data summary
        run: |
          echo "=== Data files in public/ ==="
          for f in public/prasarana-daily*.json public/ktmb-daily*.json public/*-stations.json public/*-routes.json public/dosm-*.json; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f")
              echo "  $f: ${size} bytes"
            fi
          done
          echo ""
          echo "=== DOSM OD Daily data_as_of ==="
          if [ -f public/dosm-od-daily-totals.json ]; then
            python3 -c "
            import json
            with open('public/dosm-od-daily-totals.json') as f:
              d = json.load(f)
            print(f'  Static file: data_as_of={d.get(\"data_as_of\",\"N/A\")}, rows={d.get(\"row_count\",\"N/A\")}')
          " || echo "  (parse error)"
          else
            echo "  (file not found)"
          fi

      - name: Verify freshness (fails loudly if data >5 days stale)
        run: |
          python3 - <<'PYEOF'
          import json, sys
          from datetime import date, datetime
          try:
              with open('public/dosm-od-daily-totals.json') as f:
                  d = json.load(f)
              as_of = str(d.get('data_as_of', ''))[:10]
              days = (date.today() - datetime.strptime(as_of, '%Y-%m-%d').date()).days
              print(f'data_as_of={as_of} ({days} day(s) old)')
              if days > 5:
                  print('::error::Data in public/ is stale (>5 days old). '
                        'DOSM processors above did not produce fresh files '
                        '(download or parquet parse failure) — investigate.')
                  sys.exit(1)
          except SystemExit:
              raise
          except Exception as e:
              print(f'::warning::Freshness check skipped: {e}')
          PYEOF

      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- public/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ No data changes detected — data is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📋 Data files changed:"
            git status --porcelain -- public/
            git diff --stat -- public/
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ -A
          git commit -m "data: refresh OD parquet data $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          # Rebase onto any commits pushed to main since this run started
          git pull --rebase --autostash origin "$(git branch --show-current)"
          git push

  refresh-monthly:
    name: Refresh Headline Static File
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on the 12th of each month (or manual trigger) — DOSM publishes
    # the audit at 12:00 MYT on the 12th; daily job refreshes it too, so this
    # is just a backstop
    if: github.event.schedule == '45 06 12 * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run headline refresh script
        run: node scripts/refresh-headline.js
        env:
          HEADLINE_OUTPUT: public/headline-recent.json

      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- public/headline-recent.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ No headline changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/headline-recent.json
          git commit -m "data: refresh headline data $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "$(git branch --show-current)"
          git push
